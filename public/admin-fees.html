<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Fee Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/admin-fees.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            <i class="fas fa-chart-line"></i>

            Admin Fee Analytics

        </span>

        <span class="text-white">

            Welcome,

            <strong id="adminName">

                Admin

            </strong>

        </span>

    </div>

</nav>



<div class="container-fluid mt-4">


<!-- ===============================
Dashboard Cards
================================ -->

<div class="row g-3 mb-4">

<div class="col-lg-2 col-md-4">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fas fa-school fa-2x text-primary mb-2"></i>

<h6>Total Schools</h6>

<h3 id="totalSchools">0</h3>

</div>

</div>

</div>


<div class="col-lg-2 col-md-4">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fas fa-users fa-2x text-success mb-2"></i>

<h6>Total Students</h6>

<h3 id="totalStudents">0</h3>

</div>

</div>

</div>


<div class="col-lg-2 col-md-4">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fas fa-wallet fa-2x text-info mb-2"></i>

<h6>Collection</h6>

<h3 id="totalCollection">

₹0

</h3>

</div>

</div>

</div>


<div class="col-lg-2 col-md-4">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fas fa-clock fa-2x text-warning mb-2"></i>

<h6>Pending</h6>

<h3 id="pendingAmount">

₹0

</h3>

</div>

</div>

</div>


<div class="col-lg-2 col-md-4">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fas fa-chart-pie fa-2x text-danger mb-2"></i>

<h6>Collection %</h6>

<h3 id="collectionPercent">

0%

</h3>

</div>

</div>

</div>


<div class="col-lg-2 col-md-4">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="fas fa-calendar fa-2x text-secondary mb-2"></i>

<h6>This Month</h6>

<h3 id="monthCollection">

₹0

</h3>

</div>

</div>

</div>

</div>


<!-- ===============================
Filters
================================ -->

<div class="card shadow-sm mb-4">

<div class="card-header bg-primary text-white">

<i class="fas fa-filter"></i>

Analytics Filters

</div>

<div class="card-body">

<div class="row">

<div class="col-md-4">

<label>

School

</label>

<select id="schoolFilter"

class="form-select">

<option value="">

All Schools

</option>

</select>

</div>


<div class="col-md-3">

<label>

Month

</label>

<input

type="month"

id="monthFilter"

class="form-control">

</div>


<div class="col-md-3">

<label>

Status

</label>

<select

id="statusFilter"

class="form-select">

<option value="">

All

</option>

<option>

Paid

</option>

<option>

Partial

</option>

<option>

Unpaid

</option>

</select>

</div>


<div class="col-md-2 d-grid">

<label>&nbsp;</label>

<button

class="btn btn-primary"

onclick="loadSchoolReport()">

<i class="fas fa-search"></i>

Search

</button>

</div>

</div>

</div>

</div>



<!-- ===============================
School Report
================================ -->

<div class="card shadow">

<div class="card-header bg-dark text-white d-flex justify-content-between">

<span>

<i class="fas fa-table"></i>

School Fee Report

</span>

<button

class="btn btn-success btn-sm"

onclick="exportReport()">

<i class="fas fa-file-excel"></i>

Export

</button>

</div>


<div class="table-responsive">

<table

class="table table-bordered table-hover mb-0">

<thead>

<tr>

<th>School</th>

<th>Students</th>

<th>Paid</th>

<th>Partial</th>

<th>Unpaid</th>

<th>Collection</th>

<th>Pending</th>

<th>Action</th>

</tr>

</thead>

<tbody id="schoolTableBody">

<tr>

<td colspan="8"

class="text-center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>

</div>


</div>



<!-- ===============================
DETAIL MODAL
================================ -->

<div class="modal fade"

id="schoolModal">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header bg-primary text-white">

<h5>

School Fee Report

</h5>

<button

class="btn-close"

data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body"

id="schoolModalBody">

Loading...

</div>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/admin-fees.js"></script>

</body>

</html>
