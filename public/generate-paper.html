<!DOCTYPE html>
<html>
<head>
    <title>Generate Question Paper</title>
    <link rel="stylesheet" href="css/generate-paper.css">
</head>
<body>
<div class="sidebar" id="sidebar">

🚪 Logout

</div>

<div class="main" id="mainContent">

    <!-- Topbar -->

    <div class="topbar">

        <div>

            <h1>Generate Question Paper</h1>

            <p>Create professional examination papers</p>

        </div>

       <div class="admin-box">

    <div>

        <button id="backBtn" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
                   🔙 Back
            </button>

    </div>

</div>

    </div>


    <!-- Form Card -->

    <div class="paper-card">

        <div class="row">

            <div class="form-group">

                <label>School Name</label>

                <input type="text" id="schoolName" placeholder="School Name">

            </div>

            <div class="form-group">

                <label>Exam Name</label>

                <input type="text" id="examName" placeholder="Half Yearly Examination">

            </div>

        </div>


        <div class="row">

            <div class="form-group">

                <label>Board</label>

                <select id="board">

                    <option>CBSE</option>

                    <option>ICSE</option>

                    <option>State Board</option>
                </select>

            </div>

            <div class="form-group">

                <label>Class</label>

                <select id="className">
                 <option>6</option>
                 <option>7</option>
                 <option>8</option>
                 <option>9</option>
                 <option selected >10</option>
                 <option>11</option>
                 <option>12</option>
                  </select>

            </div>
        <div class="form-group">

            <label>Section</label>

            <select id="section">

             <option value="A">A</option>

              <option value="B">B</option>

              <option value="C">C</option>

              <option value="D">D</option>

            </select>

        </div>

        </div>


        <div class="row">

            <div class="form-group">

                <label>Subject</label>

                <input type="text" id="subject" placeholder="Type subject name">

            </div>

           <div class="form-group">

    <label>Select Chapters</label>

    <div id="chapterList" class="chapter-list"></div>

    <div class="chapter-actions">

        <button type="button" class="chapter-btn"
            onclick="selectAllChapters()">

            ✓ Select All

        </button>

        <button type="button" class="chapter-btn"
            onclick="clearAllChapters()">

            ✖ Clear All

        </button>

    </div>

</div>

</div>

<div class="row">

    <div class="form-group">

        <label>Question Types</label>

        <div class="question-type-list">

            <label>
                <input type="checkbox" value="MCQ">
                MCQ
            </label>

            <label>
                <input type="checkbox" value="Short Answer">
                Short Answer
            </label>

            <label>
                <input type="checkbox" value="Long Answer">
                Long Answer
            </label>

        </div>

    </div>

    <div class="form-group">

        <label>Total Marks</label>

        <input
            type="number"
            id="totalMarks"
            placeholder="Total Marks">

    </div>

    <div class="form-group">

        <label>Duration</label>

        <input
            type="text"
            id="duration"
            placeholder="Duration in hours">

    </div>

</div>

        <div class="button-area">

            <button class="generate-btn" onclick="generatePaper()">

                Generate Question Paper

            </button>

        </div>

    </div>

   <div class="paper-id-box">

    Paper ID :
    <span id="paperId">
        Not Generated
    </span>

</div>
    <!-- Preview Card -->

    <div class="preview-card">

        <h2>📄 Paper Preview</h2>

        <hr>

        <div id="paper">

            No Question Paper Generated

        </div>

        <div class="preview-buttons">

    <button class="download-btn" onclick="downloadPDF()">
        📄 Download Question Paper
    </button>

    <button class="answer-btn"
        onclick="downloadBlankAnswerSheet()">
        📝 Blank Answer Sheet
    </button>

    <button class="download-btn"
        onclick="downloadAnswerKey()">
        📘 Download Answer Key
    </button>
    <button
class="btn btn-success"
id="generateOnlineTestBtn">

<i class="fa fa-laptop"></i>

Generate Online Test

</button>

    <button class="print-btn"
        onclick="window.print()">
        🖨 Print Paper
    </button>

</div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="js/generate-paper.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- ===========================
     Edit Question Modal
=========================== -->

<div id="editModal" class="modal-overlay">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Edit Question</h2>

            <span onclick="closeEditModal()" class="close-btn">
                ×
            </span>

        </div>

        <div class="modal-body">

            <label>Question</label>

            <textarea
                id="editQuestionText"
                rows="5">
            </textarea>

            <div class="modal-row">

                <div>

                    <label>Marks</label>

                    <input
                        type="number"
                        id="editMarks">

                </div>

                <div>

                    <label>Difficulty</label>

                    <select id="editDifficulty">

                        <option>Easy</option>

                        <option>Medium</option>

                        <option>Hard</option>

                    </select>

                </div>

            </div>

            <div id="mcqArea">

                <label>Option A</label>

                <input id="optionA">

                <label>Option B</label>

                <input id="optionB">

                <label>Option C</label>

                <input id="optionC">

                <label>Option D</label>

                <input id="optionD">

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="cancel-btn"
                onclick="closeEditModal()">

                Cancel

            </button>

            <button
                class="save-btn"
                onclick="saveEditedQuestion()">

                Save

            </button>

        </div>

    </div>

</div>

<script>

const school = JSON.parse(localStorage.getItem("currentSchool"));

if (school) {

    const schoolName = document.getElementById("schoolName");
    if (schoolName) {
        schoolName.value = school.schoolName;
        schoolName.readOnly = true;
    }

    const board = document.getElementById("board");
    if (board) {
        board.value = school.board;
        board.disabled = true;
    }

}

</script>
</body>
</html>
