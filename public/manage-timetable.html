<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Manage Time Table</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="stylesheet" href="css/manage-timetable.css">

</head>

<body>



<!-- Main -->

<div class="main">

<div class="topbar">

<div>

<h1>

📅 Manage School Time Table

</h1>

<p>

Create and Manage Teacher Time Table

</p>

</div>

<div class="admin-box">

<div class="admin-avatar">

🏫

</div>

<div>

<h4 id="topSchoolName"></h4>

<span id="topPrincipalName"></span>

</div>

</div>

</div>

<!-- Form -->

<div class="form-card">

<h2>Add Time Table</h2>

<div class="grid">

<div>

<label>Day</label>

<select id="day">

<option>Monday</option>

<option>Tuesday</option>

<option>Wednesday</option>

<option>Thursday</option>

<option>Friday</option>

<option>Saturday</option>

</select>

</div>

<div>

<label>Teacher</label>

<select id="teacher">

<option value="">Select Teacher</option>

</select>

</div>

<div>

<label>Class</label>

<select id="className">

<option value="">Select Class</option>

</select>

</div>

<div>

<label>Subject</label>

<select id="subject">

<option value="">Select Subject</option>

</select>

</div>

<div>

<label>Period</label>

<select id="period">

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5</option>

<option>6</option>

<option>7</option>

<option>8</option>

</select>

</div>

<div>

<label>Start Time</label>

<input
type="time"
id="startTime">

</div>

<div>

<label>End Time</label>

<input
type="time"
id="endTime">

</div>

<div>

<label>Room No</label>

<input
type="text"
id="roomNo"
placeholder="101">

</div>

</div>

<button id="saveBtn">

💾 Save Time Table

</button>

</div>

<!-- Existing Time Table -->

<div class="table-card">

<h2>

Existing Time Table

</h2>

<table>

<thead>

<tr>

<th>Day</th>

<th>Period</th>

<th>Teacher</th>

<th>Class</th>

<th>Subject</th>

<th>Time</th>

<th>Room</th>

<th>Action</th>

</tr>

</thead>

<tbody id="timeTableBody">

</tbody>

</table>

</div>

</div>

<script src="js/manage-timetable.js"></script>

<script>

const school =
JSON.parse(localStorage.getItem("currentSchool"));

if (school){

document.getElementById("topSchoolName").innerText =
school.schoolName;

document.getElementById("topPrincipalName").innerText =
"Principal : " +
(school.principal || "Not Assigned");

}

</script>

</body>

</html>
