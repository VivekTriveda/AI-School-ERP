<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Payslips</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/my-payslips.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h2>
            <i class="fa-solid fa-file-invoice-dollar"></i>
            My Payslips
        </h2>

        <button onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </button>
    </div>

    <table>

        <thead>

            <tr>

                <th>Month</th>

                <th>Year</th>

                <th>Net Salary</th>

                <th>Payment Mode</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="salaryTable">

            <tr>

                <td colspan="6">

                    Loading...

                </td>

            </tr>

        </tbody>

    </table>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/my-payslips.js"></script>

</body>
</html>
