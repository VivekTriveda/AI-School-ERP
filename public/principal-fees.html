<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Principal Fee Monitoring</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/principal-fees.css">

</head>

<body>

    <!-- ===========================
            NAVBAR
    ============================ -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">

                <i class="fas fa-school"></i>

                Principal Fee Monitoring

            </span>

            <div class="ms-auto text-white">

                Welcome,

                <span id="principalName">

                    Principal

                </span>

            </div>

        </div>

    </nav>



    <!-- ===========================
            PAGE
    ============================ -->

    <div class="container-fluid mt-4">

        <!-- Dashboard -->

        <div class="row g-3 mb-4">

            <div class="col-lg-2 col-md-4">

                <div class="card dashboard-card">

                    <div class="card-body text-center">

                        <i class="fas fa-users fa-2x text-primary mb-2"></i>

                        <h6>Total Students</h6>

                        <h3 id="totalStudents">0</h3>

                    </div>

                </div>

            </div>

            <div class="col-lg-2 col-md-4">

                <div class="card dashboard-card">

                    <div class="card-body text-center">

                        <i class="fas fa-check-circle fa-2x text-success mb-2"></i>

                        <h6>Paid</h6>

                        <h3 id="paidStudents">0</h3>

                    </div>

                </div>

            </div>

            <div class="col-lg-2 col-md-4">

                <div class="card dashboard-card">

                    <div class="card-body text-center">

                        <i class="fas fa-clock fa-2x text-warning mb-2"></i>

                        <h6>Partial</h6>

                        <h3 id="partialStudents">0</h3>

                    </div>

                </div>

            </div>

            <div class="col-lg-2 col-md-4">

                <div class="card dashboard-card">

                    <div class="card-body text-center">

                        <i class="fas fa-times-circle fa-2x text-danger mb-2"></i>

                        <h6>Unpaid</h6>

                        <h3 id="unpaidStudents">0</h3>

                    </div>

                </div>

            </div>

            <div class="col-lg-2 col-md-4">

                <div class="card dashboard-card">

                    <div class="card-body text-center">

                        <i class="fas fa-wallet fa-2x text-info mb-2"></i>

                        <h6>Collection</h6>

                        <h4 id="totalCollection">₹0</h4>

                    </div>

                </div>

            </div>

            <div class="col-lg-2 col-md-4">

                <div class="card dashboard-card">

                    <div class="card-body text-center">

                        <i class="fas fa-exclamation-triangle fa-2x text-danger mb-2"></i>

                        <h6>Pending</h6>

                        <h4 id="pendingAmount">₹0</h4>

                    </div>

                </div>

            </div>

        </div>



        <!-- Filters -->

        <div class="card shadow mb-4">

            <div class="card-header bg-primary text-white">

                <i class="fas fa-filter"></i>

                Filter Fees

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3">

                        <label class="form-label">

                            Class

                        </label>

                        <select id="classFilter" class="form-select">

                            <option value="">All Classes</option>

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">

                            Section

                        </label>

                        <select id="sectionFilter" class="form-select">

                            <option value="">All</option>

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">

                            Month

                        </label>

                        <input type="month"
                            id="monthFilter"
                            class="form-control">

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">

                            Status

                        </label>

                        <select id="statusFilter"
                            class="form-select">

                            <option value="">All</option>

                            <option value="Paid">

                                Paid

                            </option>

                            <option value="Partial">

                                Partial

                            </option>

                            <option value="Unpaid">

                                Unpaid

                            </option>

                        </select>

                    </div>

                    <div class="col-md-3 d-grid">

                        <label>&nbsp;</label>

                        <button
                            class="btn btn-primary"
                            onclick="loadFees()">

                            <i class="fas fa-search"></i>

                            Search

                        </button>

                    </div>

                </div>

            </div>

        </div>



        <!-- Fee Table -->

        <div class="card shadow">

            <div
                class="card-header bg-dark text-white d-flex justify-content-between align-items-center">

                <span>

                    <i class="fas fa-list"></i>

                    Student Fee Report

                </span>

                <button
                    class="btn btn-success btn-sm"
                    onclick="exportFees()">

                    <i class="fas fa-file-excel"></i>

                    Export

                </button>

            </div>

            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>Admission No</th>

                            <th>Student</th>

                            <th>Class</th>

                            <th>Total Fee</th>

                            <th>Paid</th>

                            <th>Balance</th>

                            <th>Status</th>

                            <th width="120">

                                Action

                            </th>

                        </tr>

                    </thead>

                    <tbody id="feeTableBody">

                        <tr>

                            <td colspan="8"
                                class="text-center">

                                Loading...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- ===========================
            VIEW DETAILS
    ============================ -->

    <div
        class="modal fade"
        id="feeModal">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h5>

                        Student Fee Details

                    </h5>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal">

                    </button>

                </div>

                <div
                    class="modal-body"
                    id="feeModalBody">

                </div>

            </div>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/principal-fees.js"></script>

</body>

</html>
