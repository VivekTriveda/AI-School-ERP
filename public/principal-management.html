<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Principal Management</title>

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/principal-management.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<main class="school-main">

<div class="page-header">

    <div class="header-left">

        <h1>

            <i class="fa-solid fa-user-tie"></i>

            Principal Management

        </h1>

        <p id="schoolTitle"></p>

    </div>

    <button
        id="addPrincipalBtn"
        class="add-btn">

        <i class="fa-solid fa-plus"></i>

        Create Principal

    </button>

</div>

<div class="table-container">

<table class="data-table">

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="principalBody">

</tbody>

</table>

</div>

<script src="js/principal-management.js"></script>

</body>

</html>
