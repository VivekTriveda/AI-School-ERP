<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Fee Receipt</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/receipt.css">

</head>

<body>

<div class="receipt-container">

    <div class="text-center mb-4">

        <img
            id="schoolLogo"
            src="images/logo.png"
            style="height:70px;">

        <h2 id="schoolName">

            School Name

        </h2>

        <h4>

            FEE RECEIPT

        </h4>

        <hr>

    </div>

    <table class="table table-borderless">

        <tr>

            <td><b>Receipt No</b></td>

            <td id="receiptNo"></td>

            <td><b>Date</b></td>

            <td id="paymentDate"></td>

        </tr>

        <tr>

            <td><b>Student</b></td>

            <td id="studentName"></td>

            <td><b>Admission No</b></td>

            <td id="admissionNo"></td>

        </tr>

        <tr>

            <td><b>Class</b></td>

            <td id="className"></td>

            <td><b>Roll No</b></td>

            <td id="rollNo"></td>

        </tr>

        <tr>

            <td><b>Parent</b></td>

            <td id="parentName"></td>

            <td><b>Mobile</b></td>

            <td id="mobile"></td>

        </tr>

    </table>

    <hr>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>Description</th>

                <th class="text-end">Amount</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>Total Fee</td>

                <td class="text-end" id="totalFee"></td>

            </tr>

            <tr>

                <td>Discount</td>

                <td class="text-end" id="discount"></td>

            </tr>

            <tr>

                <td>Fine</td>

                <td class="text-end" id="fine"></td>

            </tr>

            <tr>

                <td>Amount Paid</td>

                <td class="text-end" id="amountPaid"></td>

            </tr>

            <tr>

                <td>Balance</td>

                <td class="text-end" id="balance"></td>

            </tr>

        </tbody>

    </table>

    <div class="row mt-5">

        <div class="col-6">

            <b>Status :</b>

            <span id="status"></span>

        </div>

        <div class="col-6 text-end">

            ___________________

            <br>

            Principal

        </div>

    </div>

    <div class="text-center mt-4">

        <button
            class="btn btn-primary"
            onclick="window.print()">

            Print Receipt

        </button>

    </div>

</div>

<script src="js/receipt.js"></script>

</body>

</html>
