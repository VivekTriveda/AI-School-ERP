<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="css/student-login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left-panel">

        <div class="overlay">

            <img src="images/logo.png"
                class="logo">

            <h1>School ERP</h1>

            <p>

                AI Powered School Management System

            </p>

        </div>

    </div>


    <div class="right-panel">

        <div class="login-box">

            <div class="icon">

                <i class="fa-solid fa-user-graduate"></i>

            </div>

            <h2>

                Student Login

            </h2>

            <p>

                Login to access your dashboard

            </p>


            <form id="studentLoginForm">

                <div class="input-group">

                    <label>

                        Username

                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter Username"
                        required>

                </div>


                <div class="input-group">

                    <label>

                        Password

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                            required>

                        <span
                            id="togglePassword">

                            <i class="fa-solid fa-eye"></i>

                        </span>

                    </div>

                </div>


                <div class="remember">

                    <label>

                        <input
                            type="checkbox"
                            id="remember">

                        Remember Me

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>


                <button
                    type="submit"
                    id="loginBtn">

                    LOGIN

                </button>

            </form>

            <div id="message"></div>

        </div>

    </div>

</div>

<script src="js/student-login.js"></script>

</body>

</html>
