<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link rel="stylesheet" href="css/student-profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <div class="profile-header">

            <h1>Student Profile</h1>

        </div>

        <div class="profile-body">

            <div class="photo-section">

                <img
                id="studentPhoto"
                src="uploads/students/images/default-student.png">

                <h2 id="studentName"></h2>

            </div>

            <div class="details">

                <table>

                    <tr>

                        <td>Admission No</td>

                        <td id="admissionNo"></td>

                    </tr>

                    <tr>

                        <td>Roll No</td>

                        <td id="rollNo"></td>

                    </tr>

                    <tr>

                        <td>Gender</td>

                        <td id="gender"></td>

                    </tr>

                    <tr>

                        <td>Date of Birth</td>

                        <td id="dob"></td>

                    </tr>

                    <tr>

                        <td>Class</td>

                        <td id="className"></td>

                    </tr>

                    <tr>

                        <td>Section</td>

                        <td id="section"></td>

                    </tr>

                    <tr>

                        <td>Parent Name</td>

                        <td id="parentName"></td>

                    </tr>

                    <tr>

                        <td>Mobile</td>

                        <td id="mobile"></td>

                    </tr>

                    <tr>

                        <td>Email</td>

                        <td id="email"></td>

                    </tr>

                    <tr>

                        <td>Address</td>

                        <td id="address"></td>

                    </tr>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="js/student-profile.js"></script>

</body>
</html>
