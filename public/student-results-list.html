<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>All Results</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/student-results-list.css">

</head>

<body>

<div class="container py-4">

    <!-- ================= Header ================= -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center flex-wrap">

                <div>

                    <h2 class="fw-bold">

                        <i class="fa-solid fa-chart-column text-primary"></i>

                        Student Result History

                    </h2>

                    <p class="text-muted mb-0">

                        View all examination results

                    </p>

                </div>

                <button
                    class="btn btn-secondary"
                    onclick="history.back()">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back

                </button>

            </div>

        </div>

    </div>

    <!-- ================= Filters ================= -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-2">

                    <input
                        type="text"
                        id="searchExam"
                        class="form-control"
                        placeholder="Search Exam">

                </div>

                <div class="col-md-3 mb-2">

                    <select
                        id="subjectFilter"
                        class="form-select">

                        <option value="">

                            All Subjects

                        </option>

                    </select>

                </div>

                <div class="col-md-3 mb-2">

                    <select
                        id="gradeFilter"
                        class="form-select">

                        <option value="">

                            All Grades

                        </option>

                        <option>A+</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                        <option>D</option>
                        <option>F</option>

                    </select>

                </div>

                <div class="col-md-2 mb-2">

                    <button
                        class="btn btn-primary w-100"
                        onclick="loadResults()">

                        <i class="fa-solid fa-filter"></i>

                        Filter

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= Summary ================= -->

    <div class="row mb-4">

        <div class="col-md-3 mb-3">

            <div class="summary-card bg-primary">

                <h3 id="totalExam">

                    0

                </h3>

                <p>Total Exams</p>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="summary-card bg-success">

                <h3 id="averagePercentage">

                    0%

                </h3>

                <p>Average</p>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="summary-card bg-warning">

                <h3 id="highestMarks">

                    0

                </h3>

                <p>Highest Marks</p>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="summary-card bg-info">

                <h3 id="passCount">

                    0

                </h3>

                <p>Passed</p>

            </div>

        </div>

    </div>

    <!-- ================= Results ================= -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Exam</th>

                            <th>Subject</th>

                            <th>Date</th>

                            <th>Marks</th>

                            <th>%</th>

                            <th>Grade</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="resultsTable">

                        <tr>

                            <td
                            colspan="8"
                            class="text-center">

                            Loading...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="js/student-results-list.js"></script>

</body>

</html>
