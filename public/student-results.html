<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/student-results.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container-fluid py-4">

    <!-- Header -->

    <div class="result-card">

        <div class="text-center mb-4">

            <img
                src="images/logo.png"
                id="schoolLogo"
                class="school-logo">

            <h2 id="schoolName">
                School Name
            </h2>

            <h4 id="examName">
                Examination
            </h4>

            <hr>

        </div>

        <!-- Student Information -->

        <div class="row">

            <div class="col-md-6">

                <table class="table table-borderless">

                    <tr>
                        <th>Student Name</th>
                        <td id="studentName">-</td>
                    </tr>

                    <tr>
                        <th>Roll No</th>
                        <td id="rollNo">-</td>
                    </tr>

                    <tr>
                        <th>Admission No</th>
                        <td id="admissionNo">-</td>
                    </tr>

                    <tr>
                        <th>Class</th>
                        <td id="className">-</td>
                    </tr>

                </table>

            </div>

            <div class="col-md-6">

                <table class="table table-borderless">

                    <tr>
                        <th>Subject</th>
                        <td id="subject">-</td>
                    </tr>

                    <tr>
                        <th>Total Marks</th>
                        <td id="totalMarks">0</td>
                    </tr>

                    <tr>
                        <th>Obtained Marks</th>
                        <td id="obtainedMarks">0</td>
                    </tr>

                    <tr>
                        <th>Percentage</th>
                        <td id="percentage">0%</td>
                    </tr>

                </table>

            </div>

        </div>

        <!-- Summary Cards -->

        <div class="row text-center mt-3">

            <div class="col-md-4 mb-3">

                <div class="summary-box">

                    <h6>Grade</h6>

                    <h2 id="grade">A+</h2>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="summary-box">

                    <h6>Status</h6>

                    <h2 id="status">PASS</h2>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="summary-box">

                    <h6>Performance</h6>

                    <h2 id="performance">Excellent</h2>

                </div>

            </div>

        </div>

        <!-- Question Wise Result -->

        <div class="mt-4">

            <h4 class="section-title">

                <i class="fa-solid fa-list-check"></i>

                Question Wise Evaluation

            </h4>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                    <tr>

                        <th width="60">#</th>

                        <th>Question</th>

                        <th>Student Answer</th>

                        <th>Correct Answer</th>

                        <th width="100">Marks</th>

                        <th width="120">Status</th>

                    </tr>

                    </thead>

                    <tbody id="resultBody">

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Teacher Remarks -->

        <div class="mt-4">

            <h4 class="section-title">

                <i class="fa-solid fa-user-check"></i>

                Teacher Remarks

            </h4>

            <div class="remarks-box" id="teacherRemarks">

                Excellent Performance

            </div>

        </div>

        <!-- Buttons -->

        <div class="text-center mt-5">

            <button
                class="btn btn-success me-2"
                id="downloadBtn">

                <i class="fa-solid fa-download"></i>

                Download PDF

            </button>

            <button
                class="btn btn-primary me-2"
                onclick="window.print()">

                <i class="fa-solid fa-print"></i>

                Print

            </button>

            <button
                class="btn btn-secondary"
                onclick="history.back()">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </button>

        </div>

    </div>

</div>

<script src="js/student-results.js"></script>

</body>
</html>
