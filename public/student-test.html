<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Examination</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/student-test.css">

</head>

<body>

<div class="exam-container">

    <!-- ================= LEFT PANEL ================= -->

    <aside class="left-panel">

        <div class="exam-header">

            <h3 id="examName">

                Computer Science Test

            </h3>

            <hr>

            <p>

                <strong>Subject :</strong>

                <span id="subject">

                    Computer Science

                </span>

            </p>

            <p>

                <strong>Total Marks :</strong>

                <span id="totalMarks">

                    80

                </span>

            </p>

            <p>

                <strong>Duration :</strong>

                <span id="duration">

                    180 Minutes

                </span>

            </p>

            <p>

                <strong>Student :</strong>

                <span id="studentName">

                </span>

            </p>

        </div>

        <div class="timer-box">

            <h5>

                Time Remaining

            </h5>

            <h1 id="timer">

                03:00:00

            </h1>

        </div>

        <button
            class="btn btn-danger w-100 mt-4"
            onclick="submitTest()">

            Submit Test

        </button>

    </aside>

    <!-- ================= MAIN PANEL ================= -->

    <main class="main-panel">

        <div class="question-header">

            <h4>

                Question

                <span id="questionNumber">

                    1

                </span>

            </h4>

            <span id="questionMarks">

                5 Marks

            </span>

        </div>

        <div class="question-box">

            <p id="questionText">

                Loading Question...

            </p>

        </div>

        <!-- MCQ -->

        <div id="mcqOptions">

            <label class="option">

                <input type="radio" name="answer" value="A">

                <span id="optionA"></span>

            </label>

            <label class="option">

                <input type="radio" name="answer" value="B">

                <span id="optionB"></span>

            </label>

            <label class="option">

                <input type="radio" name="answer" value="C">

                <span id="optionC"></span>

            </label>

            <label class="option">

                <input type="radio" name="answer" value="D">

                <span id="optionD"></span>

            </label>

        </div>

        <!-- Short Answer -->

        <div id="shortAnswerBox" style="display:none;">

            <textarea
                id="shortAnswer"
                rows="6"
                class="form-control"
                placeholder="Write your answer here..."></textarea>

        </div>

        <!-- Long Answer -->

        <div id="longAnswerBox" style="display:none;">

            <textarea
                id="longAnswer"
                rows="12"
                class="form-control"
                placeholder="Write detailed answer here..."></textarea>

        </div>

        <!-- Navigation -->

        <div class="navigation">

            <button
                class="btn btn-secondary"
                onclick="previousQuestion()">

                Previous

            </button>

            <button
                class="btn btn-warning"
                onclick="markReview()">

                Mark Review

            </button>

            <button
                class="btn btn-success"
                onclick="saveNext()">

                Save & Next

            </button>

        </div>

    </main>

    <!-- ================= RIGHT PANEL ================= -->

    <aside class="right-panel">

        <h5>

            Question Palette

        </h5>

        <div
            id="questionPalette"
            class="palette">

        </div>

        <hr>

        <div class="legend">

            <div>

                <span class="answered"></span>

                Answered

            </div>

            <div>

                <span class="review"></span>

                Review

            </div>

            <div>

                <span class="notanswered"></span>

                Not Answered

            </div>

            <div>

                <span class="current"></span>

                Current

            </div>

        </div>

    </aside>

</div>

<script src="js/student-test.js"></script>

</body>

</html>
