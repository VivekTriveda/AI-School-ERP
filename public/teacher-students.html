<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Students</title>

    <link rel="stylesheet" href="css/teacher-students.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="page-header">

        <div>
            <h1>My Students</h1>
            <p>Manage your class students</p>
        </div>

        <button class="add-btn" id="addStudentBtn">
            <i class="fas fa-user-plus"></i>
            Add Student
        </button>

    </div>

    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search by Student Name or Roll No">

    </div>

    <!-- Student Table -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Photo</th>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Parent</th>
                    <th>Mobile</th>
                    <th>Attendance</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>

<!-- ===========================
     Add Student Modal
=========================== -->

<div class="modal" id="studentModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Add New Student</h2>

            <span class="close-modal" id="closeModal">&times;</span>

        </div>
          <input type="hidden" id="studentId">
        <form id="studentForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Admission No</label>
                    <input type="text" id="admissionNo" required>
                </div>

                <div class="form-group">
                    <label>Roll No</label>
                    <input type="number" id="rollNo" required>
                </div>

                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="studentName" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <select id="gender">

                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>

                    </select>

                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="section" value="A">
                </div>
                <div class="form-group full-width">

                     <label>Student Photo</label>

                    <input
                    type="file"
                     id="studentPhoto"
                    accept="image/*">

                    <img
                      id="photoPreview"
                      src="/images/default-student.png"
                      class="preview-image">

                    </div>
                <div class="form-group">
                    <label>Parent Name</label>
                    <input type="text" id="parentName" required>
                </div>

                <div class="form-group">
                    <label>Mobile</label>
                    <input type="text" id="mobile" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group full-width">
                    <label>Address</label>

                    <textarea
                        id="address"
                        rows="3"></textarea>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="save-btn">

                    Save Student

                </button>

            </div>

        </form>

    </div>

</div>

<!-- ===========================
     Delete Student Modal
=========================== -->

<div class="modal" id="deleteModal">

    <div class="modal-content delete-modal">

        <div class="modal-header">

            <h2>Delete Student</h2>

            <span id="closeDeleteModal">&times;</span>

        </div>

        <div class="delete-body">

            <i class="fas fa-triangle-exclamation warning-icon"></i>

            <h3 id="deleteStudentName"></h3>

            <p>
                Are you sure you want to delete this student?
            </p>

            <p class="warning-text">
                This action cannot be undone.
            </p>

        </div>

        <div class="modal-footer">

            <button
                class="cancel-btn"
                id="cancelDelete">

                Cancel

            </button>

           <button
    class="confirm-delete-btn"
    id="confirmDelete">

    Delete

</button>

        </div>

    </div>

</div>

<script src="js/teacher-students.js"></script>

</body>
</html>
